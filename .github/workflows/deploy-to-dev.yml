name: Build and Deploy to Development

on:
  push:
    branches: [ development_server ]

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.set-regions.outputs.regions }}
    steps:
      - name: Set regions output from secret
        id: set-regions
        run: echo "regions=${{ secrets.AWS_REGIONS }}" >> $GITHUB_OUTPUT

  build-images-and-amis:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    environment: development
    strategy:
      matrix:
        region: ${{ fromJSON(needs.prepare-matrix.outputs.regions) }}
    permissions:
      id-token: write
      contents: read
    outputs:
      ami_${{ matrix.region }}: ${{ steps.packer_build.outputs.ami_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (Assume Role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE_ARN }}
          aws-region: ${{ matrix.region }}
          role-session-name: github-actions-session

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract short SHA
        id: vars
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: visitors-logs-systems/backend:dev-${{ steps.vars.outputs.SHORT_SHA }}

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: visitors-logs-systems/frontend:dev-${{ steps.vars.outputs.SHORT_SHA }}

      - name: Setup Packer
        uses: hashicorp/setup-packer@v2
        with:
          version: latest

      - name: Validate Packer template
        run: packer validate ./packer/visitor-logs-system-ami.pkr.hcl

      - name: Build AWS AMI (packer) and capture AMI id
        id: packer_build
        run: |
          set -euo pipefail
          packer build -machine-readable \
            -var "region=${{ matrix.region }}" \
            -var "instance_type=${{ secrets.INSTANCE_TYPE }}" \
            -var "tag_name=dev-${{ steps.vars.outputs.SHORT_SHA }}" \
            ./packer/template.pkr.hcl | tee /tmp/packer.out

          AMI_LINE=$(awk -F, '/artifact,0,id/ { print $6 }' /tmp/packer.out | tail -n1)
          AMI_ID="${AMI_LINE#*:}"

          echo "ami_id=${AMI_ID}" >> $GITHUB_OUTPUT

  dispatch-to-external:
    needs: [prepare-matrix, build-images-and-amis]
    runs-on: ubuntu-latest
    steps:
      - name: Collect AMI IDs JSON
        id: collect
        run: |
          regions='${{ needs.prepare-matrix.outputs.regions }}'
          out="{\"regions\":{"
          sep=""
          for r in $(echo "$regions" | jq -r '.[]'); do
            ami_id=$(jq -r ".\"ami_${r}\"" <<< '${{ toJSON(needs.build-images-and-amis.outputs) }}')
            out="$out$sep\"$r\":\"$ami_id\""
            sep=","
          done
          out="$out}}"
          echo "payload=$out" >> $GITHUB_OUTPUT

      - name: Dispatch event with AMIs
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.EXTERNAL_REPO_TOKEN }}
          repository: m-bilalkhan/visitor-log-system-iac
          event-type: deploy-to-dev
          client-payload: |
            {
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}",
              "amis": ${{ steps.collect.outputs.payload }},
              "tag": "dev-${{ github.sha }}"
            }
