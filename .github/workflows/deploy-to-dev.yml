name: Build and Deploy to Development

on:
  push:
    branches: [ development_server ]

jobs:
  build-and-deploy-dev:
    runs-on: ubuntu-latest
    environment: development
    strategy:
      matrix:
        region: ${{ secrets.AWS_REGIONS }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (Assume Role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE_ARN }}
          aws-region: ${{ matrix.region }}
          role-session-name: github-actions-session

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract short SHA
        id: vars
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: visitors-logs-systems/backend:dev-${{ env.SHORT_SHA }}

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: visitors-logs-systems/frontend:dev-${{ env.SHORT_SHA }}

      - name: Setup Packer
        uses: hashicorp/setup-packer@v2
        with:
          version: latest

      - name: Validate Packer template
        run: packer validate ./packer/visitor-logs-system-ami.pkr.hcl

      - name: Build AWS Ami build
        run: packer build -var "region=${{ matrix.region }}" -var "instance_type=${{ secrets.INSTANCE_TYPE }} -var "tag_name=dev-${{ env.SHORT_SHA }}" ./packer/template.pkr.hcl

      - name: Deploy to Dev (Trigger External Pipeline)
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.EXTERNAL_REPO_TOKEN }}
          repository: m-bilalkhan/visitor-log-system-iac
          event-type: deploy-to-dev
          client-payload: |
            {
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}",
              "ami_id": "${{ steps.packer.outputs.ami_id }}",
            }