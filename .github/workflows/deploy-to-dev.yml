name: Build and Deploy to Development

on:
  push:
    branches: [ development_server ]

jobs:
  build-and-deploy-dev:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (Assume Role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: github-actions-session

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract short SHA
        id: vars
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}-backend:dev-${{ env.SHORT_SHA }}

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}-frontend:dev-${{ env.SHORT_SHA }}

      - name: Build AWS Ami build
        uses: hashicorp/packer-github-actions@v2.1.0
        with:
          command: build
          working-directory: ./packer
          options: >
            -var "region=${{ secrets.AWS_REGION }}"
            -var "instance_type=${{ secrets.INSTANCE_TYPE }}"
            -var "db_host=${{ secrets.DB_HOST }}"
            -var "db_port=${{ secrets.DB_PORT }}"
            -var "db_name=${{ secrets.DB_NAME }}"
            -var "db_user=${{ secrets.DB_USER }}"
            -var "db_password=${{ secrets.DB_PASSWORD }}"
            -var "tag_name=dev-${{ env.SHORT_SHA }}"

      - name: Deploy to Dev (Trigger External Pipeline)
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.EXTERNAL_REPO_TOKEN }}
          repository: m-bilalkhan/visitor-log-system-iac
          event-type: deploy-to-dev
          client-payload: |
            {
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}",
              "ami_id": "${{ steps.packer.outputs.ami_id }}",
            }