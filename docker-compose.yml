version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: visitor-log-backend
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: visitor_log
      DB_USER: postgres
      DB_PASSWORD: password123
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - visitor-log-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: visitor-log-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - visitor-log-network

volumes:
  postgres_data:

networks:
  visitor-log-network:
    driver: bridge