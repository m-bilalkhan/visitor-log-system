version: '3.8'

services:
  backend:
    image: <aws_account_id>.dkr.ecr.<region>.amazonaws.com/visitor-log-backend:${TAG_NAME}
    container_name: visitor-log-backend
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PORT: 3001
    ports:
      - "3001:3001"
    restart: unless-stopped
    networks:
      - visitor-log-network

  frontend:
    image: <aws_account_id>.dkr.ecr.<region>.amazonaws.com/visitor-log-frontend:${TAG_NAME}
    container_name: visitor-log-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - visitor-log-network

  nginx:
    image: nginx:latest
    container_name: visitor-log-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
    restart: unless-stopped
    networks:
      - visitor-log-network

volumes:
  postgres_data:

networks:
  visitor-log-network:
    driver: bridge