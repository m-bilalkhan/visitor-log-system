version: '3.8'

services:
  backend:
    image: ${ECR_REG}/visitor-log-system/backend:${IMG_TAG}
    container_name: backend
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PORT: 3001
    ports:
      - "3001:3001"
    network_mode: host
    restart: unless-stopped

  frontend:
    image: ${ECR_REG}/visitor-log-system/frontend:${IMG_TAG}
    container_name: frontend
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - visitor-log-network

volumes:
  postgres_data:

networks:
  visitor-log-network:
    driver: bridge